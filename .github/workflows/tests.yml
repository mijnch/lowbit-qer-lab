name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # 저장소를 읽기만 한다 — GITHUB_TOKEN 을 쓰기 권한 없이 발급받는다

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}   # 같은 브랜치에 연달아 푸시하면 앞 실행을 취소한다
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # 실제 실행은 1~2분. 러너가 멈춰도 기본값(6시간)까지 돌지 않게 한다
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: 단위 검증 (Eckart–Young, k=0 ↔ QER, RTN 오차 한계, 비트 예산, safetensors 읽기)
        run: python -m pytest -q
      - name: T1 연기 시험 (합성 256×256, 랭크 8)
        run: python scripts/t1_layer_curve.py --weight synthetic:outlier:256x256:0 --bits 3 --rank 8 --no-figure
